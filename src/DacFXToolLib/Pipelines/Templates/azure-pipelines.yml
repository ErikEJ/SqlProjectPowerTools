# -----------------------------------------------------------------------------
# Azure DevOps pipeline for the SQL database project '{{ProjectName}}'
# Generated by SQL Database Project Power Tools - regenerate from the project
# context menu, settings are stored in {{OptionsFile}}
#
# Guide: {{DocsUrl}}
# Setup checklist: pipelines/PIPELINE-SETUP.md
#
# Stages:
#   Build    - build the .dacpac{{CodeAnalysisComment}} and publish it as an artifact
{{ValidateComment}}#   Plan     - (staging/production only) script the intended changes with
#              SqlPackage Script + DeployReport for review before approval
#   Deploy   - deploy the SAME .dacpac with SqlPackage Publish
#              Approvals are configured on the Azure DevOps Environment
# -----------------------------------------------------------------------------

trigger:
  branches:
    include:
      - {{DefaultBranch}}
{{TriggerPaths}}
# Azure Repos Git ignores YAML PR triggers; configure a Build validation branch policy there.
pr:
  branches:
    include:
      - {{DefaultBranch}}

variables:
  buildConfiguration: Release
  projectFile: '{{ProjectPath}}'
  projectFolder: '{{ProjectFolder}}'

stages:
  - stage: Build
    displayName: Build database project
    jobs:
      - job: Build
        pool:
{{BuildPool}}
        steps:
          - checkout: self

{{BuildSteps}}

          # Copy the .dacpac (and any referenced .dacpac files) plus the publish profiles
          - task: CopyFiles@2
            displayName: Collect .dacpac and publish profiles
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)/$(projectFolder)'
              Contents: |
                **/bin/$(buildConfiguration)/**/*.dacpac
                *.publish.xml
              TargetFolder: '$(Build.ArtifactStagingDirectory)/dacpac'
              flattenFolders: true

          - publish: '$(Build.ArtifactStagingDirectory)/dacpac'
            artifact: dacpac
            displayName: Publish dacpac artifact
{{ValidateStage}}
{{EnvironmentStages}}
