# -----------------------------------------------------------------------------
# Reusable steps template: install the latest SqlPackage and run it against ONE
# environment, either to plan (Script + DeployReport) or to deploy (Publish).
# Generated by SQL Database Project Power Tools
#
# Guide: {{DocsUrl}}
#
# Required variables in the environment variable group:
#   SqlServerName   - for example myserver.database.windows.net
#   DatabaseName    - the target user database
{{RequiredVariablesComment}}# -----------------------------------------------------------------------------

parameters:
  - name: mode
    type: string
    values:
      - plan
      - deploy
  - name: stageName
    type: string
  - name: dacpacName
    type: string
  - name: publishProfile
    type: string
  - name: planBeforeDeploy
    type: boolean
    default: false
  - name: serviceConnection
    type: string
    default: ''

steps:
  # Always use the LATEST SqlPackage - the copy on the hosted images and the one
  # bundled with the built-in tasks often lag behind. The installed version is
  # printed to the log so every run shows which version was used.
  # Guide: {{DocsUrl}}#using-the-latest-sqlpackage
  - pwsh: |
      $toolPath = Join-Path $env:AGENT_TEMPDIRECTORY 'sqlpackage'
      dotnet tool install microsoft.sqlpackage --tool-path $toolPath
      if ($LASTEXITCODE -ne 0) { throw 'Unable to install SqlPackage' }
      Write-Host "##vso[task.prependpath]$toolPath"
      dotnet tool list --tool-path $toolPath
    displayName: Install latest SqlPackage
{{FirewallOpen}}
{{RunStepHeader}}
        $ErrorActionPreference = 'Stop'
        $mode = '${{ parameters.mode }}'
        $dacpacFolder = Join-Path $env:PIPELINE_WORKSPACE 'dacpac'
        $dacpac = Join-Path $dacpacFolder ($env:DACPAC_NAME + '.dacpac')
        $publishProfile = Join-Path $dacpacFolder $env:PUBLISH_PROFILE
        $outFolder = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'plan'
        New-Item -ItemType Directory -Force -Path $outFolder | Out-Null

        # Settings such as BlockOnPossibleDataLoss and DropObjectsNotInSource
        # are kept in the publish profile, one per environment
        $arguments = @(
          "/SourceFile:$dacpac",
          "/Profile:$publishProfile",
          "/TargetServerName:$env:SQL_SERVER",
          "/TargetDatabaseName:$env:SQL_DATABASE"
        )
{{AuthArguments}}{{SqlCmdArguments}}
        function Invoke-SqlPackage([string] $action, [string[]] $extra) {
          Write-Host "Running SqlPackage /Action:$action"
          & sqlpackage "/Action:$action" @arguments @extra
          if ($LASTEXITCODE -ne 0) { throw "SqlPackage $action failed with exit code $LASTEXITCODE" }
        }

        if ($mode -eq 'plan') {
          # Script the intended changes for review before the approval
          $script = Join-Path $outFolder '${{ parameters.stageName }}.sql'
          $report = Join-Path $outFolder 'deployreport.xml'
          Invoke-SqlPackage 'Script' @("/OutputPath:$script")
          Invoke-SqlPackage 'DeployReport' @("/OutputPath:$report")

          [xml] $xml = Get-Content -Path $report -Raw
          $summary = [System.Collections.Generic.List[string]]::new()
          $summary.Add('## Planned database changes for ${{ parameters.stageName }}')
          $summary.Add('')
          $count = 0
          foreach ($operation in $xml.DeploymentReport.Operations.Operation) {
            foreach ($item in $operation.Item) {
              $summary.Add(('- **{0}** `{1}` ({2})' -f $operation.Name, $item.Value, $item.Type))
              $count++
            }
          }
          if ($count -eq 0) { $summary.Add('No schema changes.') }
          foreach ($alert in $xml.DeploymentReport.Alerts.Alert) {
            foreach ($issue in $alert.Issue) {
              $summary.Add(('- WARNING **{0}** {1}' -f $alert.Name, $issue.Value))
            }
          }
          $summary.Add('')
          $summary.Add('The full deployment script is in the ''plan-${{ parameters.stageName }}'' artifact.')
          $summaryPath = Join-Path $outFolder 'summary.md'
          $summary | Set-Content -Path $summaryPath -Encoding utf8
          Write-Host "##vso[task.uploadsummary]$summaryPath"
        }
        else {
          if ('${{ parameters.planBeforeDeploy }}' -eq 'True') {
            # Drift check: the target must still match the approved plan
            $approved = Join-Path $env:PIPELINE_WORKSPACE 'plan-${{ parameters.stageName }}/deployreport.xml'
            $current = Join-Path $outFolder 'deployreport-current.xml'
            Invoke-SqlPackage 'DeployReport' @("/OutputPath:$current")
            [xml] $approvedXml = Get-Content -Path $approved -Raw
            [xml] $currentXml = Get-Content -Path $current -Raw
            $approvedText = $approvedXml.OuterXml
            $currentText = $currentXml.OuterXml
            if ($approvedText -ne $currentText) {
              Write-Host '##vso[task.logissue type=error]The target database changed after the plan was approved. Run the pipeline again to create and approve a new plan.'
              throw 'Drift detected between plan and deploy'
            }
            Write-Host 'No drift detected - the target still matches the approved plan.'
          }

          Invoke-SqlPackage 'Publish' @()
        }
    displayName: SqlPackage ${{ parameters.mode }}
    env:
      SQL_SERVER: $(SqlServerName)
      SQL_DATABASE: $(DatabaseName)
      DACPAC_NAME: ${{ parameters.dacpacName }}
      PUBLISH_PROFILE: ${{ parameters.publishProfile }}
{{EnvMappings}}{{FirewallClose}}
