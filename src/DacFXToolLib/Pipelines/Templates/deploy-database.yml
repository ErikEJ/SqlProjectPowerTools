# -----------------------------------------------------------------------------
# Reusable stage template: plan (optional) + deploy of the database to ONE environment
# Generated by SQL Database Project Power Tools
#
# Guide: {{DocsUrl}}#stages-that-script-the-intended-changes
#
# planBeforeDeploy: true is used for staging and production type environments.
#   The Plan stage runs SqlPackage Script + DeployReport against the target and
#   publishes the result as the 'plan-<stage>' artifact and as a run summary.
#   Add an approval check on the Azure DevOps Environment so reviewers can read
#   the plan before the Deploy stage starts.
#   The Deploy stage creates a new DeployReport and FAILS if it differs from the
#   approved one (drift between plan and deploy), then runs SqlPackage Publish.
# -----------------------------------------------------------------------------

parameters:
  - name: environment
    type: string
  - name: stageName
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: variableGroup
    type: string
  - name: publishProfile
    type: string
  - name: planBeforeDeploy
    type: boolean
    default: false
  - name: serviceConnection
    type: string
    default: ''
  - name: dacpacName
    type: string
  - name: pool
    type: object

stages:
  - ${{ if eq(parameters.planBeforeDeploy, true) }}:
    - stage: Plan_${{ parameters.stageName }}
      displayName: Plan ${{ parameters.environment }}
      dependsOn: ${{ parameters.dependsOn }}
      # Never deploy from pull request builds
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
      variables:
        - group: ${{ parameters.variableGroup }}
      jobs:
        - job: Plan
          displayName: Script intended changes
          pool: ${{ parameters.pool }}
          steps:
            - checkout: none
            - download: current
              artifact: dacpac

            - template: sqlpackage-steps.yml
              parameters:
                mode: plan
                stageName: ${{ parameters.stageName }}
                dacpacName: ${{ parameters.dacpacName }}
                publishProfile: ${{ parameters.publishProfile }}
                planBeforeDeploy: ${{ parameters.planBeforeDeploy }}
                serviceConnection: ${{ parameters.serviceConnection }}

            - publish: '$(Build.ArtifactStagingDirectory)/plan'
              artifact: plan-${{ parameters.stageName }}
              displayName: Publish plan (script + deploy report)

  - stage: Deploy_${{ parameters.stageName }}
    displayName: Deploy ${{ parameters.environment }}
    ${{ if eq(parameters.planBeforeDeploy, true) }}:
      dependsOn: Plan_${{ parameters.stageName }}
    ${{ else }}:
      dependsOn: ${{ parameters.dependsOn }}
    # Never deploy from pull request builds
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      - group: ${{ parameters.variableGroup }}
    jobs:
      - deployment: Deploy
        displayName: Deploy database
        # Approvals and checks are configured on this Azure DevOps Environment
        environment: ${{ parameters.environment }}
        pool: ${{ parameters.pool }}
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: dacpac
                - ${{ if eq(parameters.planBeforeDeploy, true) }}:
                  - download: current
                    artifact: plan-${{ parameters.stageName }}

                - template: sqlpackage-steps.yml
                  parameters:
                    mode: deploy
                    stageName: ${{ parameters.stageName }}
                    dacpacName: ${{ parameters.dacpacName }}
                    publishProfile: ${{ parameters.publishProfile }}
                    planBeforeDeploy: ${{ parameters.planBeforeDeploy }}
                    serviceConnection: ${{ parameters.serviceConnection }}
